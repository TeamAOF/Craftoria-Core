plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.146'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    maven {
        name "Modmaven"
        url "https://modmaven.dev"
    }

    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }

    exclusiveContent {
        forRepository {
            maven {
                url "https://cursemaven.com"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }

    maven {
        name "TerraformersMC"
        url "https://maven.terraformersmc.com/releases/"
        content {
            // EMI
            includeGroup "dev.emi"
        }
    }

    maven { url = "https://maven.bawnorton.com/releases" }
    maven { url = "https://maven.kosmx.dev/" }

    maven {
        name = "Shadows of Fire's Maven"
        url "https://maven.shadowsoffire.dev/releases"
    }

    maven {
        url "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }

    maven {
        url 'https://jitpack.io'
        content {
            includeGroup "com.github.rtyley"
        }
    }

    maven {
        name = "Illusive Soulworks maven"
        url = "https://maven.theillusivec4.top/"
    }

    maven { url 'https://maven.blamejared.com' }

    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup("software.bernie.geckolib")
        }
    }

    maven { url "https://maven.architectury.dev/" }
    maven { url = 'https://maven.minecraftforge.net/' }

    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content { includeGroup "thedarkcolour" }
    }

    maven {
        url "https://maven.squiddev.cc"
        content {
            includeGroup("cc.tweaked")
        }
    }

    maven { url = "https://maven.ftb.dev/releases" } // FTB Mods
    maven { url = "https://mvn.devos.one/snapshots" } // Registrate

    maven {
        name = 'Create Mod Maven'
        url = "https://maven.createmod.net/"
    }

    maven {
        name = "Team Resourceful Maven"
        url = "https://maven.teamresourceful.com/repository/maven-public/"
    }

    maven {
        url "https://maven.firstdark.dev/releases"
    }

    maven {
        url "https://maven.breakinblocks.com/releases"
    }

    maven {
        url "https://dl.cloudsmith.io/public/klikli-dev/mods/maven/"
        content {
            includeGroup "com.klikli_dev"
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // MixinSquared's annotationProcessor MUST be registered BEFORE Mixin's one.
    compileOnly(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-common:0.3.7-beta.1"))
    implementation(jarJar("com.github.bawnorton.mixinsquared:mixinsquared-neoforge:0.3.7-beta.1"))

    compileOnly("com.hypherionmc.sdlink:sdlink:3.3.1")
    compileOnly("com.hypherionmc.craterlib:CraterLib-NeoForge-1.21:2.1.5")

    implementation "dev.architectury:architectury-neoforge:${architectury_api_version}"
    implementation "curse.maven:shatterbyte-lib-916747:8040848"
    implementation "curse.maven:relics-mod-445274:8158315"

    implementation "maven.modrinth:c2me-neoforge:0.4.0-alpha.0.120+1.21.1"
    implementation "curse.maven:revelationary-656526:8664567"
    implementation "curse.maven:modonomicon-538392:8532346"
    implementation "curse.maven:spectrum-556967:8679750"
    implementation "com.teamresourceful.resourcefullib:resourcefullib-neoforge-1.21:3.0.12"
    implementation "com.teamresourceful.resourcefulconfig:resourcefulconfig-neoforge-1.21:3.0.11"
    implementation "tech.alexnijjar.endermanoverhaul:endermanoverhaul-neoforge-${minecraft_version}:${enderman_overhaul_version}"
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    implementation "top.theillusivec4.curios:curios-neoforge:${curios_version}+${minecraft_version}"

    implementation("org.appliedenergistics:appliedenergistics2:${ae2_version}")
    implementation("curse.maven:glodium-957920:5821676")
    implementation("curse.maven:extendedae-plus-1337639:8755074")
    implementation("curse.maven:applied-mekanistics-574300:7096962")
    implementation("curse.maven:applied-flux-965012:8204513")
    implementation("maven.modrinth:mega:${mega_cells_version}")
    implementation("de.mari_023:ae2wtlib:19.5.1")
    implementation("curse.maven:ex-pattern-provider-892005:8811572")
    implementation("curse.maven:advancedae-1084104:8564177")

    implementation("curse.maven:yacl-667299:7437845")
    implementation("curse.maven:reliable-emi-1411826:8828211")
    implementation("dev.emi:emi-neoforge:${emi_version}")
    implementation("maven.modrinth:tmrv:${tmrv_version}+mc.21.1")

    implementation("com.klikli_dev:modonomicon-${minecraft_version}-neoforge:${modonomicon_version}")
    implementation("com.breakinblocks.neovitae:neovitae:${minecraft_version}-${neovitae_version}")
    implementation("com.breakinblocks.animusnv:AnimusNV:${minecraft_version}-${animusnv_version}")

    localRuntime("curse.maven:kotlin-for-forge-351264:8335665")
    implementation("curse.maven:fzzy-config-1005914:7568897")
    implementation("curse.maven:subtle-effects-1023913:8008312")

    compileOnly("mekanism:Mekanism:${minecraft_version}-${mekanism_version}:all")

    localRuntime("mekanism:Mekanism:${minecraft_version}-${mekanism_version}")
    localRuntime("mekanism:Mekanism:${minecraft_version}-${mekanism_version}:generators")
    localRuntime("mekanism:Mekanism:${minecraft_version}-${mekanism_version}:tools")

    implementation "curse.maven:just-dire-things-1002348:7463040"

    implementation("curse.maven:xycraft-653786:5601037")
    implementation("curse.maven:xycraft-world-653789:5601038")
    implementation("curse.maven:xycraft-machines-653791:5601045")

    compileOnly("top.theillusivec4.curios:curios-neoforge:${curios_version}+${minecraft_version}")
    compileOnly("curse.maven:industrial-foregoing-266515:6626624")
    compileOnly("curse.maven:titanium-287342:6443608")

    compileOnly("curse.maven:lendercataclysm-551586:8706841")
    compileOnly("curse.maven:lionfish-api-1001614:8345326")

    localRuntime("dev.latvian.mods:kubejs-neoforge:${kubejs_version}")

    compileOnly("curse.maven:sound-physics-remastered-535489:6809432")

    // Just used to verify nbt ordering works with creative sort
    implementation("dev.shadowsoffire:GatewaysToEternity:${minecraft_version}-${gatewaysVersion}")
    implementation("dev.shadowsoffire:Placebo:${minecraft_version}-${placeboVersion}")
    implementation("dev.shadowsoffire:ApothicAttributes:${minecraft_version}-${apothAttribsVersion}")
    implementation("dev.shadowsoffire:ApothicSpawners:${minecraft_version}-${apothSpawnersVersion}")
    implementation("dev.shadowsoffire:ApothicEnchanting:${minecraft_version}-${apothEnchVersion}")
    implementation("dev.shadowsoffire:Apotheosis:${minecraft_version}-${apothVersion}")

    implementation("curse.maven:building-gadgets-298187:6850515")
    implementation("curse.maven:ender-storage-1-8-245174:6159037")
    implementation("curse.maven:codechicken-lib-1-8-242818:6583751")

    implementation("curse.maven:styled-chat-unofficial-neoforge-1117967:5795252")
    implementation("curse.maven:functional-storage-556861:8459097")
    implementation("curse.maven:titanium-287342:8760562")

    implementation("curse.maven:transmog-848032:6010596")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description,
                             ae2_version_range      : ae2_version_range,]
    inputs.properties replaceProperties

    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
